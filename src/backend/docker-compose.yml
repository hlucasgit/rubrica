# Composición de referencia para levantar la plataforma en desarrollo local.
# Los healthchecks y el HSM/KMS real quedan fuera del alcance de este archivo
# (ver docs/07-seguridad/modelo-seguridad.md) — en este compose,
# SecureSign.Crypto.Api usa el proveedor de software solo para desarrollo.
#
# Las migraciones de EF Core NO las aplica cada Api al arrancar (ver
# src/Migrator) — cada servicio con estado tiene un job "*-migrate" que
# corre una sola vez, aplica su esquema, y termina; el Api correspondiente
# solo arranca si ese job termina con éxito (`service_completed_successfully`).

services:
  gateway:
    build:
      context: .
      dockerfile: src/Gateway/SecureSign.Gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Compose de desarrollo: Development habilita el secreto de ejemplo
      # (ver ValidadorOpcionesJwt, RUNBOOK.md 12.27). Para sobreescribirlo sin
      # tocar appsettings.json: SECRETO_CLIENTE_INTERNO en un .env junto a este
      # archivo — debe ser el MISMO valor en gateway, documents y signature.
      ASPNETCORE_ENVIRONMENT: "Development"
      Jwt__SecretoClienteInterno: "${SECRETO_CLIENTE_INTERNO:-dev-only-internal-client-secret-do-not-use-in-production}"
    volumes:
      # Llaves RSA de firma (ver RsaKeyStore, RUNBOOK.md 12.21) — en un
      # volumen nombrado, no en la imagen ni en el repo, para que sobrevivan
      # a un `docker compose up` sin --build y no se pierdan (ni se
      # comiteen) por accidente. Si el volumen está vacío, el Gateway genera
      # una llave nueva sola al arrancar.
      - securesign_gateway_llaves:/app/llaves
    depends_on:
      - securesign-documents-api
      - securesign-signature-api
      - securesign-evidence-api
      - securesign-identity-api
      - securesign-audit-api

  # --- Migraciones (una por servicio con estado, corren una vez y terminan) ---

  securesign-identity-migrate:
    build:
      context: .
      dockerfile: src/Migrator/Dockerfile
    command: ["identity"]
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=securesign_identity;Username=securesign;Password=securesign_dev_only"
    depends_on:
      postgres:
        condition: service_healthy

  securesign-documents-migrate:
    build:
      context: .
      dockerfile: src/Migrator/Dockerfile
    command: ["documents"]
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=securesign_documents;Username=securesign;Password=securesign_dev_only"
    depends_on:
      postgres:
        condition: service_healthy

  securesign-signature-migrate:
    build:
      context: .
      dockerfile: src/Migrator/Dockerfile
    command: ["signature"]
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=securesign_signature;Username=securesign;Password=securesign_dev_only"
    depends_on:
      postgres:
        condition: service_healthy

  securesign-evidence-migrate:
    build:
      context: .
      dockerfile: src/Migrator/Dockerfile
    command: ["evidence"]
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=securesign_evidence;Username=securesign;Password=securesign_dev_only"
    depends_on:
      postgres:
        condition: service_healthy

  securesign-audit-migrate:
    build:
      context: .
      dockerfile: src/Migrator/Dockerfile
    command: ["audit"]
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=securesign_audit;Username=securesign;Password=securesign_dev_only"
    depends_on:
      postgres:
        condition: service_healthy

  # --- Servicios de aplicación ---

  securesign-identity-api:
    build:
      context: .
      dockerfile: src/Services/SecureSign.Identity/SecureSign.Identity.Api/Dockerfile
    expose: ["8080"]
    depends_on:
      securesign-identity-migrate:
        condition: service_completed_successfully

  securesign-documents-api:
    build:
      context: .
      dockerfile: src/Services/SecureSign.Documents/SecureSign.Documents.Api/Dockerfile
    expose: ["8080"]
    environment:
      # Compose de desarrollo: Development habilita el secreto de ejemplo
      # (ver ValidadorOpcionesJwt, RUNBOOK.md 12.27). Para sobreescribirlo sin
      # tocar appsettings.json: SECRETO_CLIENTE_INTERNO en un .env junto a este
      # archivo — debe ser el MISMO valor en gateway, documents y signature.
      ASPNETCORE_ENVIRONMENT: "Development"
      Jwt__SecretoClienteInterno: "${SECRETO_CLIENTE_INTERNO:-dev-only-internal-client-secret-do-not-use-in-production}"
    volumes:
      # AlmacenamientoDocumentalLocal (solo para desarrollo, ver su propio
      # comentario) escribe en /tmp/securesign-documentos DENTRO del
      # contenedor — sin este volumen, cada vez que se reconstruye/reinicia
      # este servicio (algo frecuente en desarrollo) los archivos físicos se
      # pierden aunque el registro en Postgres siga existiendo, dejando
      # documentos "huérfanos" que fallan con 404/500 al leer su contenido.
      - securesign_documentos_local:/tmp/securesign-documentos
    depends_on:
      securesign-documents-migrate:
        condition: service_completed_successfully

  securesign-signature-api:
    build:
      context: .
      dockerfile: src/Services/SecureSign.Signature/SecureSign.Signature.Api/Dockerfile
    expose: ["8080"]
    environment:
      # Compose de desarrollo: Development habilita el secreto de ejemplo
      # (ver ValidadorOpcionesJwt, RUNBOOK.md 12.27). Para sobreescribirlo sin
      # tocar appsettings.json: SECRETO_CLIENTE_INTERNO en un .env junto a este
      # archivo — debe ser el MISMO valor en gateway, documents y signature.
      ASPNETCORE_ENVIRONMENT: "Development"
      Jwt__SecretoClienteInterno: "${SECRETO_CLIENTE_INTERNO:-dev-only-internal-client-secret-do-not-use-in-production}"
      # Por defecto apunta al Crypto.Api en Docker (proveedor de software).
      # Para firmar con un token PKCS#11 real (DNIe u otro), corre
      # Crypto.Api NATIVO en Windows (no se puede en un contenedor Linux) y
      # sobreescribe esta variable, p. ej. en un archivo .env junto a este
      # docker-compose.yml: CRIPTOGRAFIA_API_URL=http://host.docker.internal:5003
      # — ver src/backend/RUNBOOK.md.
      ServiciosInternos__CriptografiaApiUrl: "${CRIPTOGRAFIA_API_URL:-http://securesign-crypto-api:8080}"
      ServiciosInternos__CriptografiaAlgoritmo: "${CRIPTOGRAFIA_ALGORITMO:-EcdsaSha256}"
    depends_on:
      securesign-signature-migrate:
        condition: service_completed_successfully
      securesign-identity-api:
        condition: service_started

  securesign-evidence-api:
    build:
      context: .
      dockerfile: src/Services/SecureSign.Evidence/SecureSign.Evidence.Api/Dockerfile
    expose: ["8080"]
    depends_on:
      securesign-evidence-migrate:
        condition: service_completed_successfully

  securesign-audit-api:
    build:
      context: .
      dockerfile: src/Services/SecureSign.Audit/SecureSign.Audit.Api/Dockerfile
    expose: ["8080"]
    depends_on:
      securesign-audit-migrate:
        condition: service_completed_successfully

  securesign-crypto-api:
    build:
      context: .
      dockerfile: src/Services/SecureSign.Crypto/SecureSign.Crypto.Api/Dockerfile
    expose: ["8080"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: securesign
      POSTGRES_PASSWORD: securesign_dev_only
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d
      - securesign_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securesign -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  securesign_pg_data:
  securesign_documentos_local:
  securesign_gateway_llaves:
