name: CI — build, test y migraciones

# Dos jobs separados a propósito (ver informe de preauditoría INDECOPI/IOFE,
# hallazgo P0-04): el backend (servicios ASP.NET Core, todos net8.0 puro)
# compila y corre en Ubuntu, pero SecureSign.FirmadorLocal es
# net8.0-windows + WinForms — NUNCA compila en un runner Linux
# (NETSDK1100), así que antes rompía el build de main con solo tocar
# CUALQUIER archivo del repo, sin relación con el Firmador. Se usa un
# solution filter (SecureSign.Backend.slnf) para que el job de Linux nunca
# intente tocar ese proyecto, y un job aparte en windows-latest valida que
# el Firmador siga compilando.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-build-test-migrate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: securesign
          POSTGRES_PASSWORD: securesign_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U securesign"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar
        run: dotnet restore src/backend/SecureSign.Backend.slnf

      - name: Compilar
        run: dotnet build src/backend/SecureSign.Backend.slnf --no-restore --configuration Release

      - name: Pruebas unitarias
        run: dotnet test src/backend/tests/SecureSign.UnitTests/SecureSign.UnitTests.csproj --no-build --configuration Release

      - name: Crear bases de datos de cada servicio
        env:
          PGPASSWORD: securesign_dev_only
        run: |
          psql -h localhost -U securesign -d postgres -c "CREATE DATABASE securesign_documents;"
          psql -h localhost -U securesign -d postgres -c "CREATE DATABASE securesign_signature;"
          psql -h localhost -U securesign -d postgres -c "CREATE DATABASE securesign_evidence;"
          psql -h localhost -U securesign -d postgres -c "CREATE DATABASE securesign_identity;"
          psql -h localhost -U securesign -d postgres -c "CREATE DATABASE securesign_audit;"

      # Este es el paso que antes hacía cada Api sola al arrancar
      # (Database.Migrate() en Program.cs) — ahora es un paso de pipeline
      # explícito, visible y que falla el build si una migración es inválida,
      # antes de intentar desplegar nada.
      - name: Aplicar migraciones (documents, signature, evidence, identity, audit)
        env:
          ConnectionStrings__Postgres_Documents: "Host=localhost;Port=5432;Database=securesign_documents;Username=securesign;Password=securesign_dev_only"
          ConnectionStrings__Postgres_Signature: "Host=localhost;Port=5432;Database=securesign_signature;Username=securesign;Password=securesign_dev_only"
          ConnectionStrings__Postgres_Evidence: "Host=localhost;Port=5432;Database=securesign_evidence;Username=securesign;Password=securesign_dev_only"
          ConnectionStrings__Postgres_Identity: "Host=localhost;Port=5432;Database=securesign_identity;Username=securesign;Password=securesign_dev_only"
          ConnectionStrings__Postgres_Audit: "Host=localhost;Port=5432;Database=securesign_audit;Username=securesign;Password=securesign_dev_only"
        run: |
          ConnectionStrings__Postgres="$ConnectionStrings__Postgres_Documents" dotnet run --project src/backend/src/Migrator/SecureSign.Migrator.csproj --no-build --configuration Release -- documents
          ConnectionStrings__Postgres="$ConnectionStrings__Postgres_Signature" dotnet run --project src/backend/src/Migrator/SecureSign.Migrator.csproj --no-build --configuration Release -- signature
          ConnectionStrings__Postgres="$ConnectionStrings__Postgres_Evidence" dotnet run --project src/backend/src/Migrator/SecureSign.Migrator.csproj --no-build --configuration Release -- evidence
          ConnectionStrings__Postgres="$ConnectionStrings__Postgres_Identity" dotnet run --project src/backend/src/Migrator/SecureSign.Migrator.csproj --no-build --configuration Release -- identity
          ConnectionStrings__Postgres="$ConnectionStrings__Postgres_Audit" dotnet run --project src/backend/src/Migrator/SecureSign.Migrator.csproj --no-build --configuration Release -- audit

  firmador-local-build:
    # Solo compila (WinForms + PKCS11Interop exigen Windows) — validar que
    # el Firmador Local (incluida la parte nueva de SecureSign.Pades) no se
    # rompe con cambios en main, sin bloquear el pipeline del backend con
    # un requisito de runner Windows en cada PR trivial del resto del repo.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar
        run: dotnet restore src/backend/src/Tools/SecureSign.FirmadorLocal/SecureSign.FirmadorLocal.csproj

      - name: Compilar
        run: dotnet build src/backend/src/Tools/SecureSign.FirmadorLocal/SecureSign.FirmadorLocal.csproj --no-restore --configuration Release
