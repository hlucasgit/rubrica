name: CI — build, test y migraciones

# Dos jobs separados a propósito (ver informe de preauditoría INDECOPI/IOFE,
# hallazgo P0-04): el backend (servicios ASP.NET Core, todos net8.0 puro)
# compila y corre en Ubuntu, pero SecureSign.FirmadorLocal es
# net8.0-windows + WinForms — NUNCA compila en un runner Linux
# (NETSDK1100), así que antes rompía el build de main con solo tocar
# CUALQUIER archivo del repo, sin relación con el Firmador. Se usa un
# solution filter (SecureSign.Backend.slnf) para que el job de Linux nunca
# intente tocar ese proyecto, y un job aparte en windows-latest valida que
# el Firmador siga compilando.

# Informe de preauditoría INDECOPI/IOFE (27/09/2026), hallazgo P3-01: las acciones fijadas en Node.js 20
# generaban una advertencia en cada corrida ("forced to run on Node.js 24") porque GitHub ya no soporta ese
# runtime. Actualizadas a las últimas versiones mayores que declaran node24 en su propio action.yml
# (actions/checkout@v7, actions/setup-dotnet@v6, actions/upload-artifact@v7, gitleaks/gitleaks-action@v3) —
# confirmado contra las notas de versión de cada una, sin cambios de comportamiento/entradas/salidas, solo el
# runtime. Ver RUNBOOK.md 12.53.

# Informe de trabajo del 30/09/2026 (Agente 4, DevSecOps): "generación automática de SBOM por release" y
# "almacenamiento de evidencias" — un SBOM/manifiesto/instalador que solo vive como artefacto de Actions
# expira a los 90 días (retention-days de arriba); un Release de GitHub no expira. `tags: securesign-sfd-v*`
# hace que empujar el tag de un release (RUNBOOK.md 12.62/12.65) dispare `release-manifest-firmador` una vez
# más, esta vez adjuntando SBOM + manifiesto + MSI como assets PERMANENTES del propio Release, no solo como
# artefacto de Actions. `workflow_dispatch` deja re-adjuntar evidencia a un tag/Release YA existente sin
# necesidad de crear un tag nuevo desechable — así es como se verificó esto en vivo (ver RUNBOOK.md 12.65).
on:
  push:
    branches: [main]
    tags: ["securesign-sfd-v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Informe de preauditoría INDECOPI/IOFE (27/09/2026), hallazgo P1-05: no
  # existía ningún gate dedicado a detección de secretos — SAST (CodeQL) y
  # SCA (dotnet list package --vulnerable) no cubren ese caso, y el
  # repositorio es público. Gitleaks escanea el historial completo de cada
  # push/PR contra su set de reglas por defecto (AWS, GitHub, Slack, Stripe,
  # JWT, llaves privadas PEM, credenciales genéricas de alta entropía).
  # `.gitleaks.toml` en la raíz solo excluye el falso positivo conocido y
  # documentado (`securesign_dev_only`, la contraseña de Postgres de
  # desarrollo/CI, nunca usada fuera de docker-compose local o este pipeline).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks — detección de secretos
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-build-test-migrate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: securesign
          POSTGRES_PASSWORD: securesign_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U securesign"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar
        run: dotnet restore src/backend/SecureSign.Backend.slnf

      - name: Compilar
        run: dotnet build src/backend/SecureSign.Backend.slnf --no-restore --configuration Release

      - name: Pruebas unitarias
        run: dotnet test src/backend/tests/SecureSign.UnitTests/SecureSign.UnitTests.csproj --no-build --configuration Release

      # Informe de preauditoría INDECOPI/IOFE, §14/15: "Inventario/SBOM —
      # Crear". Genera un inventario real de dependencias (CycloneDX) en
      # cada build, no solo para releases — así un PR que introduce una
      # dependencia nueva queda reflejado de inmediato.
      # RUNBOOK.md 12.69 — hallazgo real: dotnet-CycloneDX NO normaliza los separadores de ruta `\` que trae un
      # .slnf (Visual Studio siempre los genera así; el propio SDK de .NET sí los normaliza al compilar/restaurar
      # en Linux, pero esta herramienta de terceros no) — en el runner Ubuntu, cada ruta de proyecto se trataba
      # como un único nombre de archivo inválido ("Project file ... does not exist" para los 36 proyectos),
      # "Found 0 packages", y un SBOM vacío publicado como si hubiera funcionado (exit 0, sin ningún error).
      # Se genera una copia del .slnf con `/` SOLO para esta herramienta — el archivo real del repositorio
      # queda intacto, con `\`, para que Visual Studio en Windows lo siga abriendo sin problema.
      - name: Generar SBOM del backend (CycloneDX)
        run: |
          dotnet tool install --global CycloneDX
          export PATH="$PATH:$HOME/.dotnet/tools"
          python3 -c "
          import json
          with open('src/backend/SecureSign.Backend.slnf') as f:
              datos = json.load(f)
          barra_invertida = chr(92)  # evita cualquier ambigüedad de escapado bash/YAML/Python con un '\\' literal
          datos['solution']['path'] = datos['solution']['path'].replace(barra_invertida, '/')
          datos['solution']['projects'] = [p.replace(barra_invertida, '/') for p in datos['solution']['projects']]
          with open('/tmp/SecureSign.Backend.linux.slnf', 'w') as f:
              json.dump(datos, f)
          "
          dotnet-CycloneDX /tmp/SecureSign.Backend.linux.slnf -o sbom --exclude-test-projects -F Json -sn SecureSign-Backend -sv ${{ github.sha }}

      - name: Publicar SBOM del backend
        uses: actions/upload-artifact@v7
        with:
          name: sbom-backend
          path: sbom/bom.json
          retention-days: 90

      # Informe de preauditoría INDECOPI/IOFE, §17: "SAST/SCA — Sí
      # obligatorio". Esto es el SCA: dotnet list package --vulnerable ya
      # trae el analizador de NuGet Audit incorporado (misma base de datos
      # de advisories que GitHub) — sin instalar nada de terceros. Falla el
      # build si aparece cualquier paquete (directo o transitivo) con una
      # vulnerabilidad conocida. DOTNET_CLI_UI_LANGUAGE=en fuerza el texto
      # en inglés para que el grep no dependa del locale del runner.
      - name: SCA — dependencias con vulnerabilidades conocidas
        env:
          DOTNET_CLI_UI_LANGUAGE: en
        run: |
          dotnet list src/backend/SecureSign.Backend.slnf package --vulnerable --include-transitive | tee sca-report.txt
          if grep -q "has the following vulnerable packages" sca-report.txt; then
            echo "::error::Se encontraron dependencias con vulnerabilidades conocidas — ver el reporte arriba."
            exit 1
          fi

      - name: Crear bases de datos de cada servicio
        env:
          PGPASSWORD: securesign_dev_only
        run: |
          psql -h localhost -U securesign -d postgres -c "CREATE DATABASE securesign_documents;"
          psql -h localhost -U securesign -d postgres -c "CREATE DATABASE securesign_signature;"
          psql -h localhost -U securesign -d postgres -c "CREATE DATABASE securesign_evidence;"
          psql -h localhost -U securesign -d postgres -c "CREATE DATABASE securesign_identity;"
          psql -h localhost -U securesign -d postgres -c "CREATE DATABASE securesign_audit;"

      # Este es el paso que antes hacía cada Api sola al arrancar
      # (Database.Migrate() en Program.cs) — ahora es un paso de pipeline
      # explícito, visible y que falla el build si una migración es inválida,
      # antes de intentar desplegar nada.
      - name: Aplicar migraciones (documents, signature, evidence, identity, audit)
        env:
          ConnectionStrings__Postgres_Documents: "Host=localhost;Port=5432;Database=securesign_documents;Username=securesign;Password=securesign_dev_only"
          ConnectionStrings__Postgres_Signature: "Host=localhost;Port=5432;Database=securesign_signature;Username=securesign;Password=securesign_dev_only"
          ConnectionStrings__Postgres_Evidence: "Host=localhost;Port=5432;Database=securesign_evidence;Username=securesign;Password=securesign_dev_only"
          ConnectionStrings__Postgres_Identity: "Host=localhost;Port=5432;Database=securesign_identity;Username=securesign;Password=securesign_dev_only"
          ConnectionStrings__Postgres_Audit: "Host=localhost;Port=5432;Database=securesign_audit;Username=securesign;Password=securesign_dev_only"
        run: |
          ConnectionStrings__Postgres="$ConnectionStrings__Postgres_Documents" dotnet run --project src/backend/src/Migrator/SecureSign.Migrator.csproj --no-build --configuration Release -- documents
          ConnectionStrings__Postgres="$ConnectionStrings__Postgres_Signature" dotnet run --project src/backend/src/Migrator/SecureSign.Migrator.csproj --no-build --configuration Release -- signature
          ConnectionStrings__Postgres="$ConnectionStrings__Postgres_Evidence" dotnet run --project src/backend/src/Migrator/SecureSign.Migrator.csproj --no-build --configuration Release -- evidence
          ConnectionStrings__Postgres="$ConnectionStrings__Postgres_Identity" dotnet run --project src/backend/src/Migrator/SecureSign.Migrator.csproj --no-build --configuration Release -- identity
          ConnectionStrings__Postgres="$ConnectionStrings__Postgres_Audit" dotnet run --project src/backend/src/Migrator/SecureSign.Migrator.csproj --no-build --configuration Release -- audit

  firmador-local-build:
    # Solo compila (WinForms + PKCS11Interop exigen Windows) — validar que
    # el Firmador Local (incluida la parte nueva de SecureSign.Pades) no se
    # rompe con cambios en main, sin bloquear el pipeline del backend con
    # un requisito de runner Windows en cada PR trivial del resto del repo.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar
        run: dotnet restore src/backend/src/Tools/SecureSign.FirmadorLocal/SecureSign.FirmadorLocal.csproj

      - name: Compilar
        run: dotnet build src/backend/src/Tools/SecureSign.FirmadorLocal/SecureSign.FirmadorLocal.csproj --no-restore --configuration Release

  # Informe de preauditoría INDECOPI/IOFE, hallazgo P0-06 ("Autenticidad e
  # integridad del software distribuido") y §14 (release controlado): esto
  # cubre la parte que SÍ se puede hacer sin comprar nada todavía — SBOM del
  # ejecutable distribuido y un manifiesto SHA-256 versionado por commit.
  # La firma Authenticode del binario/instalador depende de un certificado de
  # firma de código real (trámite de compra/identidad jurídica, no de código):
  # el pipeline de firma, el instalador MSI y su prueba ya existen (ver
  # RUNBOOK.md 12.35) y se activan solos cuando exista el secreto CODESIGN_PFX_BASE64.
  # Corre en push a main, en push de un tag de release (securesign-sfd-v*) y bajo demanda
  # (workflow_dispatch) — no en cada PR — porque es, conceptualmente, el job "CI Release" que el informe pide
  # separado del build de validación. El paso final ("Adjuntar evidencia al Release") solo se ejecuta cuando
  # el disparador fue un tag o un workflow_dispatch apuntando a uno — un push a main normal no tiene ningún
  # Release al que adjuntar nada.
  release-manifest-firmador:
    needs: [backend-build-test-migrate, firmador-local-build]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/securesign-sfd-v')))
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar
        run: dotnet restore src/backend/src/Tools/SecureSign.FirmadorLocal/SecureSign.FirmadorLocal.csproj

      - name: Generar SBOM del Firmador Local (CycloneDX)
        shell: pwsh
        run: |
          dotnet tool install --global CycloneDX
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          dotnet-CycloneDX src/backend/src/Tools/SecureSign.FirmadorLocal/SecureSign.FirmadorLocal.csproj -o sbom -F Json -sn SecureSign-FirmadorLocal -sv ${{ github.sha }}

      # Sin --self-contained: el binario evaluable/distribuido debe ser
      # reproducible desde el mismo commit, sin publicar todo el runtime de
      # .NET todavía (eso queda para cuando exista firma Authenticode real).
      - name: Publicar binario Release
        run: dotnet publish src/backend/src/Tools/SecureSign.FirmadorLocal/SecureSign.FirmadorLocal.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Generar manifiesto SHA-256
        shell: pwsh
        run: |
          $lineas = @("# SecureSign Firmador Local — manifiesto de artefacto", "commit: ${{ github.sha }}", "generado: $(Get-Date -AsUTC -Format o)", "")
          Get-ChildItem -Path publish -Recurse -File | Sort-Object FullName | ForEach-Object {
            $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
            $rutaRelativa = $_.FullName.Substring((Resolve-Path publish).Path.Length + 1)
            $lineas += "$($hash.Hash)  $rutaRelativa"
          }
          $lineas | Set-Content -Path publish/SHA256SUMS.txt -Encoding utf8

      - name: Publicar artefacto (binario + SBOM + manifiesto)
        uses: actions/upload-artifact@v7
        with:
          name: securesign-firmador-local-${{ github.sha }}
          path: |
            publish/
            sbom/bom.json
          retention-days: 90

      # ---- Instalador MSI + firma Authenticode (RUNBOOK.md 12.35) ----------------------------------
      # Cierra la parte de P0-06 que SÍ es ingeniería: instalador por usuario, pipeline de firma con
      # verificación y prueba real de instalar/desinstalar. La FIRMA en sí depende de un certificado de firma
      # de código (procura): mientras el secreto CODESIGN_PFX_BASE64 no exista, el MSI se genera SIN FIRMA, el
      # manifiesto lo declara así y el paso avisa con una anotación — nunca se firma en silencio con otra cosa.
      - name: Instalar WiX 5.0.x (herramienta .NET, licencia MS-RL)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet	ools" >> $env:GITHUB_PATH

      - name: Preparar certificado de firma de código (solo si existe el secreto)
        id: certificado
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
        run: |
          if ($env:CODESIGN_PFX_BASE64) {
            $ruta = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
            [IO.File]::WriteAllBytes($ruta, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
            "ruta=$ruta" >> $env:GITHUB_OUTPUT
            "firmar=true" >> $env:GITHUB_OUTPUT
          } else {
            "firmar=false" >> $env:GITHUB_OUTPUT
            Write-Host "::warning::No existe el secreto CODESIGN_PFX_BASE64: el instalador se genera SIN FIRMA de código y no debe distribuirse a usuarios finales (P0-06)."
          }

      # Informe de preauditoría INDECOPI/IOFE, hallazgo P1-07: la versión de PRODUCTO (SemVer, "1.0.0")
      # y el metadato de BUILD (número de run de CI + commit) son cosas distintas — el número de run no es
      # una versión funcional, solo trazabilidad (RUNBOOK.md 12.45). El MSI, el ejecutable y el instalador
      # muestran siempre "1.0.0"; el run/commit va solo en AssemblyInformationalVersion y el manifiesto.
      - name: Construir instalador (publicar, firmar, empaquetar MSI)
        shell: pwsh
        env:
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          $parametros = @{
            Version = '1.0.0'
            BuildMetadata = "build.${{ github.run_number }}.sha.${{ github.sha }}"
            Salida = "artifacts/firmador-local"
          }
          if ('${{ steps.certificado.outputs.firmar }}' -eq 'true') {
            $parametros['Firmar'] = $true
            $parametros['PfxRuta'] = '${{ steps.certificado.outputs.ruta }}'
          }
          ./src/backend/src/Tools/SecureSign.FirmadorLocal/installer/Construir-Instalador.ps1 @parametros

      # Máquina limpia (runner nuevo): aquí SÍ se verifica también el protocolo securesign://.
      - name: Probar instalador (instalar, verificar, desinstalar)
        shell: pwsh
        run: ./src/backend/src/Tools/SecureSign.FirmadorLocal/installer/Probar-Instalador.ps1 -Msi "artifacts/firmador-local/SecureSignFirmadorLocal-1.0.0.msi" -Version "1.0.0"

      - name: Borrar el certificado del runner
        if: always()
        shell: pwsh
        run: |
          $ruta = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          if (Test-Path $ruta) { Remove-Item $ruta -Force }

      - name: Publicar instalador (MSI + manifiesto)
        uses: actions/upload-artifact@v7
        with:
          name: securesign-firmador-local-instalador-${{ github.sha }}
          path: |
            artifacts/firmador-local/*.msi
            artifacts/firmador-local/SHA256SUMS-instalador.txt
          retention-days: 90

      # Informe de trabajo del 30/09/2026 (Agente 4, DevSecOps): "almacenamiento de evidencias" — un artefacto
      # de Actions expira a los 90 días (retention-days de arriba); un Release de GitHub no expira. Solo corre
      # cuando el disparador es el tag de un release (push del tag o workflow_dispatch apuntando a él) — un
      # Release ya debe existir para ese tag (creado a mano al cortar el release, RUNBOOK.md 12.62), este paso
      # solo le adjunta evidencia, nunca crea el Release. --clobber hace el paso idempotente: correrlo de nuevo
      # sobre el mismo tag reemplaza los archivos en vez de fallar porque ya existen.
      - name: Descargar SBOM del backend (generado en el otro job de este mismo run)
        if: startsWith(github.ref, 'refs/tags/securesign-sfd-v')
        uses: actions/download-artifact@v7
        with:
          name: sbom-backend
          path: sbom-backend

      - name: Adjuntar evidencia al Release (SBOM backend + Firmador Local, manifiestos, instalador)
        if: startsWith(github.ref, 'refs/tags/securesign-sfd-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item sbom-backend/bom.json sbom-backend-bom.json
          Copy-Item sbom/bom.json sbom-firmador-local-bom.json
          gh release upload "${{ github.ref_name }}" `
            sbom-backend-bom.json `
            sbom-firmador-local-bom.json `
            publish/SHA256SUMS.txt `
            artifacts/firmador-local/*.msi `
            artifacts/firmador-local/SHA256SUMS-instalador.txt `
            --repo "${{ github.repository }}" --clobber
